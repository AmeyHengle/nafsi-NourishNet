name: NourishNet Data Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger from Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: cd pipeline && npm install

      - name: Install Playwright Chromium
        run: cd pipeline && npx playwright install chromium --with-deps

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: cd pipeline && node index.js

      - name: Commit updated data files
        run: |
          git config user.name "nourishnet-pipeline[bot]"
          git config user.email "bot@nourishnet.dev"
          git add public/data.json public/url_directory.json public/pending_submissions.json
          git diff --staged --quiet || git commit -m "chore: pipeline run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
