name: NourishNet Telegram Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

jobs:
  poll-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: cd pipeline && npm install

      - name: Poll Telegram and process messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: cd pipeline && node bot-poll.js

      - name: Commit state changes
        run: |
          git config user.name "nourishnet-bot[bot]"
          git config user.email "bot@nourishnet.dev"
          git add public/bot_state.json public/bot_conversations.json public/pending_submissions.json
          git diff --staged --quiet || git commit -m "chore: bot poll $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
